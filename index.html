<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal 9</title>
<link rel="icon" href="https://i.postimg.cc/bJhgw2zd/Gemini-Generated-Image-kl9ro8kl9ro8kl9r.jpg">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --cyan:#00f3ff; --red:#ff0055; --green:#39ff14; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:radial-gradient(ellipse at top,#14141a 0%,#0a0a0c 60%); color:#fff; font-family:'Montserrat',sans-serif; }
  .screen { position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px; }
  .screen.on { display:flex; animation:in .6s ease both; }
  .brand { display:flex; gap:10px; align-items:center; font-weight:700; font-size:18px; position:absolute; top:34px; }
  .brand img { width:28px; height:28px; }
  /* login */
  h2 { font-size:14px; margin:0 0 14px; }
  input { width:min(420px,86vw); padding:12px 16px; font:600 16px 'Montserrat',sans-serif; text-align:center; color:#fff; background:rgba(255,255,255,.03); backdrop-filter:blur(16px); border:2px solid rgba(255,255,255,.4); border-radius:10px; outline:none; }
  input:focus-visible { border-color:var(--cyan); box-shadow:0 0 14px rgba(0,243,255,.4); }
  #err { color:var(--red); font-size:13px; min-height:20px; margin-top:12px; }
  /* game */
  #game { background:#fff; color:#111; }
  #clock { font:700 44px 'Montserrat',sans-serif; color:#2ff5d0; text-shadow:0 0 14px #2ff5d0; font-variant-numeric:tabular-nums; margin-bottom:18px; }
  #btn { width:56px; height:56px; border-radius:50%; background:#b00000; border:2px solid #333; cursor:pointer; }
  #btn:active { transform:scale(.94); }
  #ready { position:absolute; inset:0; background:rgba(128,128,128,.92); backdrop-filter:blur(8px); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; color:#fff; font-size:13px; }
  #ready button { padding:14px 40px; font:700 15px 'Montserrat',sans-serif; background:#fff; border:3px solid #f5e6a0; border-radius:14px; cursor:pointer; }
  /* overlays */
  .ov { position:fixed; inset:0; z-index:5; display:none; padding:34px; background:rgba(0,0,0,.72); backdrop-filter:blur(14px); }
  .ov.on { display:block; animation:in .7s ease both; }
  .ov .box { height:100%; border:3px solid; border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; position:relative; }
  .ov h1 { margin:0; font-size:clamp(36px,9vw,56px); }
  .ov p { margin:8px 0 0; font-size:15px; }
  .ov small { position:absolute; bottom:16px; font-size:12px; }
  .ov .brand { top:20px; }
  #pass .box { border-color:var(--green); box-shadow:0 0 22px rgba(57,255,20,.5), inset 0 0 22px rgba(57,255,20,.2); }
  #pass h1 { color:var(--green); text-shadow:0 0 18px var(--green); }
  #elim .box { border-color:var(--red); box-shadow:0 0 22px rgba(255,0,85,.5), inset 0 0 22px rgba(255,0,85,.2); }
  #elim h1 { color:var(--red); text-shadow:0 0 18px var(--red); }
  @keyframes in { from { opacity:0; transform:scale(.96); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion:reduce) { .screen.on,.ov.on { animation:none; } }
</style>
</head>
<body>

<section id="login" class="screen on">
  <div class="brand"><img src="https://i.postimg.cc/bJhgw2zd/Gemini-Generated-Image-kl9ro8kl9ro8kl9r.jpg" alt=""> TERMINAL 9</div>
  <h2>LOGIN</h2>
  <input id="uid" placeholder="Unique ID here" autocomplete="off" autocapitalize="characters" spellcheck="false">
  <div id="err" role="alert"></div>
</section>

<section id="game" class="screen">
  <div id="clock">60.00</div>
  <button id="btn" aria-label="Press"></button>
  <div id="ready"><span>BEFORE STARTING READ THE INSTRUCTIONS</span><button id="go">Ready!</button></div>
</section>

<div id="pass" class="ov"><div class="box">
  <div class="brand"><img src="https://i.postimg.cc/bJhgw2zd/Gemini-Generated-Image-kl9ro8kl9ro8kl9r.jpg" alt=""> TERMINAL 9</div>
  <h1>PASSED</h1><p>Check Discord or the instructions for the next game</p>
  <small>*Remember to login back tomorrow!</small>
</div></div>

<div id="elim" class="ov"><div class="box">
  <div class="brand"><img src="https://i.postimg.cc/bJhgw2zd/Gemini-Generated-Image-kl9ro8kl9ro8kl9r.jpg" alt=""> TERMINAL 9</div>
  <h1>ELIMINATED</h1><p id="elimDay">You made it until DAY x</p>
  <small>*You can not longer Login, Thank you for participating!</small>
</div></div>

<script>
// ===== CONFIG: your Firebase Realtime Database URL (no trailing slash) =====
const DB = "https://project-4162381477655572279-default-rtdb.firebaseio.com/";
// ==========================================================================
const $ = id => document.getElementById(id);
const api = (path, method='GET', body) =>
  fetch(`${DB}/${path}.json`, { method, body: body && JSON.stringify(body) }).then(r => r.json());
let uid, player, day;

function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('on')); $(id).classList.add('on'); }

$('uid').addEventListener('keydown', async e => {
  if (e.key !== 'Enter') return;
  uid = e.target.value.trim().toUpperCase();
  $('err').textContent = '';
  if (!/^T9-[A-Z0-9-]+$/.test(uid)) return $('err').textContent = 'Invalid ID. Check it and try again.';
  try {
    player = await api('players/' + uid);
    if (!player) return $('err').textContent = 'ID not found. Check it and try again.';
    day = (await api('config/active_day')) || 1;
    if (player.status === 'eliminated') return eliminated(player.eliminated_day || player.current_day);
    if (player.current_day > day) return $('pass').classList.add('on');
    startDay();
  } catch { $('err').textContent = 'Connection error. Try again.'; }
});

function eliminated(d) { $('elimDay').textContent = 'You made it until DAY ' + d; $('elim').classList.add('on'); }

function startDay() { show('game'); } // Day 1 only; add other days via a switch on `day`


let t0, raf, over = false;
$('go').onclick = () => { $('ready').style.display = 'none'; t0 = performance.now(); over = false; loop(); };
function left() { return Math.max(0, 60 - (performance.now() - t0) / 1000); }
function loop() {
  const l = left();
  $('clock').textContent = l.toFixed(2).padStart(5, '0');
  if (l <= 0) return finish(false);
  raf = requestAnimationFrame(loop);
}
$('btn').onclick = () => { if (!t0 || over) return; finish(left() >= 7 && left() < 8); };
async function finish(ok) {
  if (over) return; over = true; cancelAnimationFrame(raf);
  if (ok) { $('pass').classList.add('on'); await api('players/' + uid, 'PATCH', { current_day: day + 1 }); }
  else { eliminated(day); await api('players/' + uid, 'PATCH', { status: 'eliminated', eliminated_day: day }); }
}
</script>
</body>
</html>
